<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            li {
                list-style: none;
            }
            a {
                text-decoration: none;
            }
            #wrap {
                width: 1000px;
                margin: 0 auto;
                background-color: darkgray;
            }
            ul {
                height: 80px;
                display: flex;
            }
            li {
                width: 20%;
                font-size: 20%;
                font-weight: bold;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            li:nth-child(1) {
                background-color: red;
            }
            li:nth-child(2) {
                background-color: orange;
            }
            li:nth-child(3) {
                background-color: blue;
            }
            li:nth-child(4) {
                background-color: green;
            }
            li:nth-child(5) {
                background-color: yellow;
            }
            .iframe_inner {
                width: 100%;
                height: 600px;
                background-color: crimson;
            }
        </style>
    </head>

    <body>
        <h1>iframe 연습</h1>
        <div id="wrap">
            <ul>
                <li><a href="red.html" target="color">menu01</a></li>
                <li><a href="orange.html">menu02</a></li>
                <li><a href="blue.html">menu03</a></li>
                <li><a href="green.html">menu04</a></li>
                <li><a href="yellow.html">menu05</a></li>
            </ul>
            <div class="iframe_inner">
                <iframe src="" frameborder="1" width="100%" height="100%" name="color"></iframe>
            </div>
        </div>
    </body>
</html>
